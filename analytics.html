<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Amzy Host</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --font-display: 'Orbitron', monospace;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Dark theme — refined indigo accent */
            --bg-primary: #050508;
            --bg-secondary: rgba(255,255,255,0.02);
            --bg-card: rgba(255,255,255,0.03);
            --bg-glass: rgba(255,255,255,0.04);
            --bg-input: rgba(255,255,255,0.04);
            --bg-hover: rgba(255,255,255,0.06);

            --text-primary: #f0f0f5;
            --text-secondary: rgba(255,255,255,0.55);
            --text-muted: rgba(255,255,255,0.35);
            --text-dim: rgba(255,255,255,0.2);

            --border-color: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --border-active: rgba(255,255,255,0.2);

            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99,102,241,0.35);
            --accent-glow-soft: rgba(99,102,241,0.1);

            --error: #ef4444;
            --error-soft: rgba(239,68,68,0.1);
            --success: #10b981;
            --success-soft: rgba(16,185,129,0.1);
            --warning: #f59e0b;

            --shadow-color: rgba(0,0,0,0.4);
            --grid-color: rgba(255,255,255,0.015);
            --scanline-color: rgba(255,255,255,0.012);

            /* Chart colors */
            --chart-grid: rgba(255,255,255,0.04);
            --chart-label: rgba(255,255,255,0.2);
            --chart-line: rgba(255,255,255,0.5);
            --chart-point: #000000;
            --chart-point-border: rgba(255,255,255,0.6);
            --chart-fill-start: rgba(255,255,255,0.08);
            --chart-fill-end: rgba(255,255,255,0);
            --bar-bg: rgba(255,255,255,0.08);
            --bar-hover: rgba(255,255,255,0.2);
            --bar-glow: rgba(255,255,255,0.1);
            --bar-tooltip-bg: rgba(255,255,255,0.1);
            --bar-tooltip-border: rgba(255,255,255,0.15);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: rgba(0,0,0,0.02);
            --bg-card: rgba(255,255,255,0.7);
            --bg-glass: rgba(255,255,255,0.6);
            --bg-input: rgba(0,0,0,0.03);
            --bg-hover: rgba(0,0,0,0.04);

            --text-primary: #0f172a;
            --text-secondary: rgba(15,23,42,0.55);
            --text-muted: rgba(15,23,42,0.35);
            --text-dim: rgba(15,23,42,0.2);

            --border-color: rgba(0,0,0,0.06);
            --border-hover: rgba(0,0,0,0.12);
            --border-active: rgba(0,0,0,0.2);

            --accent: #4f46e5;
            --accent-light: #6366f1;
            --accent-glow: rgba(79,70,229,0.25);
            --accent-glow-soft: rgba(79,70,229,0.08);

            --shadow-color: rgba(0,0,0,0.08);
            --grid-color: rgba(0,0,0,0.03);
            --scanline-color: rgba(0,0,0,0.008);

            --chart-grid: rgba(0,0,0,0.04);
            --chart-label: rgba(0,0,0,0.2);
            --chart-line: rgba(0,0,0,0.5);
            --chart-point: #ffffff;
            --chart-point-border: rgba(0,0,0,0.6);
            --chart-fill-start: rgba(0,0,0,0.08);
            --chart-fill-end: rgba(0,0,0,0);
            --bar-bg: rgba(0,0,0,0.08);
            --bar-hover: rgba(0,0,0,0.2);
            --bar-glow: rgba(0,0,0,0.1);
            --bar-tooltip-bg: rgba(0,0,0,0.1);
            --bar-tooltip-border: rgba(0,0,0,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* ===== BACKGROUND EFFECTS ===== */
        #network-canvas {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
        }

        .grid-overlay {
            position: fixed; inset: 0; z-index: 1;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
        }

        .scanlines {
            position: fixed; inset: 0; z-index: 2;
            background: linear-gradient(to bottom, transparent 50%, var(--scanline-color) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            animation: scanMove 10s linear infinite;
        }

        @keyframes scanMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        .vignette {
            position: fixed; inset: 0; z-index: 3;
            background: radial-gradient(ellipse at center, transparent 30%, var(--bg-primary) 90%);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .noise {
            position: fixed; inset: 0; z-index: 4;
            opacity: 0.015; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ===== AMBIENT GLOWS ===== */
        .ambient-glow {
            position: fixed; width: 500px; height: 500px;
            border-radius: 50%; filter: blur(120px);
            opacity: 0.1; pointer-events: none; z-index: 0;
            transition: opacity 0.5s ease;
        }

        .ambient-glow-1 {
            background: var(--accent); top: -200px; right: -100px;
            animation: floatGlow 8s ease-in-out infinite;
        }

        .ambient-glow-2 {
            background: var(--accent-light); bottom: -300px; left: -100px;
            animation: floatGlow 10s ease-in-out infinite reverse;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; height: 68px;
            background: rgba(var(--bg-primary), 0.7);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease, background 0.5s ease, border-color 0.5s ease;
        }

        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }

        .logo-icon {
            width: 36px; height: 36px;
            border: 1.5px solid var(--accent);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display);
            font-size: 18px; font-weight: 900; color: var(--accent);
            animation: logoPulse 3s ease-in-out infinite;
            box-shadow: 0 0 12px var(--accent-glow-soft), inset 0 0 12px var(--accent-glow-soft);
            transition: border-color 0.5s ease, color 0.5s ease, box-shadow 0.5s ease;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 12px var(--accent-glow-soft), inset 0 0 12px var(--accent-glow-soft); }
            50% { box-shadow: 0 0 24px var(--accent-glow), inset 0 0 18px var(--accent-glow-soft); }
        }

        .brand-text {
            font-family: var(--font-display);
            font-size: 16px; font-weight: 700;
            letter-spacing: 3px; text-transform: uppercase;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }

        .nav-links { display: flex; gap: 6px; }

        .nav-links a {
            padding: 8px 18px; border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none; font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }

        .nav-links a::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--bg-hover), transparent);
            border-radius: 8px; opacity: 0;
            transition: opacity 0.3s;
        }

        .nav-links a:hover::before, .nav-links a.active::before { opacity: 1; }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
            background: var(--bg-secondary);
        }

        .nav-links a.active {
            box-shadow: inset 0 1px 0 var(--border-hover), 0 0 20px var(--accent-glow-soft);
        }

        .nav-right { display: flex; align-items: center; gap: 14px; }

        .coin-badge {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 100px;
            font-family: var(--font-display);
            font-size: 12px; letter-spacing: 1px;
            color: var(--text-primary); cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .coin-badge:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px var(--accent-glow-soft);
        }

        .theme-toggle-btn {
            width: 36px; height: 36px; border-radius: 9px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            backdrop-filter: blur(10px);
        }

        .theme-toggle-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            transform: rotate(15deg) scale(1.1);
            border-color: var(--border-hover);
        }

        .user-menu { position: relative; }
        .user-menu .avatar {
            width: 36px; height: 36px; border-radius: 10px;
            border: 1.5px solid var(--border-color);
            cursor: pointer; transition: all 0.3s; object-fit: cover;
        }
        .user-menu .avatar:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow-soft);
        }
        .user-menu .dropdown {
            position: absolute; top: 50px; right: 0;
            width: 190px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px; padding: 8px;
            opacity: 0; pointer-events: none;
            transform: translateY(-8px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .user-menu:hover .dropdown {
            opacity: 1; pointer-events: all;
            transform: translateY(0) scale(1);
        }
        .user-menu .dropdown a {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none; font-size: 13px;
            transition: all 0.2s;
        }
        .user-menu .dropdown a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .user-menu .dropdown hr {
            border: none; border-top: 1px solid var(--border-color);
            margin: 6px 0;
        }

        /* ===== MAIN ===== */
        .main-content {
            position: relative; z-index: 10;
            padding: 100px 32px 48px;
            max-width: 1200px; margin: 0 auto;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
        }
        .page-title {
            font-family: var(--font-display);
            font-size: 28px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-primary);
            transition: color 0.5s ease;
        }
        .page-title::after {
            content: ''; display: block;
            width: 40px; height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
            margin-top: 8px; opacity: 0.5;
            animation: titleLine 3s ease-in-out infinite;
        }
        @keyframes titleLine {
            0%, 100% { width: 40px; opacity: 0.5; }
            50% { width: 80px; opacity: 0.2; }
        }

        /* ===== PERIOD SELECTOR ===== */
        .period-selector {
            display: flex; gap: 4px;
            padding: 4px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .period-btn {
            padding: 8px 16px;
            background: transparent; border: none; border-radius: 8px;
            color: var(--text-muted);
            font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
            font-family: var(--font-body);
            letter-spacing: 0.5px;
        }
        .period-btn:hover {
            color: var(--text-secondary);
            background: var(--bg-input);
        }
        .period-btn.active {
            background: var(--accent-glow-soft);
            color: var(--accent-light);
            box-shadow: 0 2px 8px var(--accent-glow-soft);
            border: 1px solid var(--accent-glow-soft);
        }

        /* ===== STATS GRID ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex; align-items: center; gap: 16px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease forwards;
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--bg-hover), transparent);
            transition: left 0.6s;
        }
        .stat-card:hover::before { left: 100%; }
        .stat-card:hover {
            background: var(--bg-glass);
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px var(--shadow-color);
        }
        .stat-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--accent);
            transition: all 0.3s;
            box-shadow: 0 0 15px var(--accent-glow-soft);
        }
        .stat-card:hover .stat-icon {
            background: var(--accent-glow-soft);
            border-color: var(--accent);
            transform: scale(1.1);
            box-shadow: 0 0 25px var(--accent-glow-soft);
        }
        .stat-info h3 {
            font-family: var(--font-display);
            font-size: 22px; font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--accent-glow-soft);
        }
        .stat-info p {
            font-size: 11px; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 2px;
        }
        .stat-change {
            font-size: 11px; margin-top: 4px;
            display: flex; align-items: center; gap: 4px;
        }
        .stat-change.up { color: var(--success); }
        .stat-change.down { color: var(--error); }

        /* ===== CHARTS GRID ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 24px;
            transition: all 0.4s ease;
            position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease forwards;
        }
        .chart-card::before {
            content: ''; position: absolute; inset: 0; border-radius: 18px;
            padding: 1px;
            background: linear-gradient(160deg, var(--border-hover) 0%, transparent 40%, transparent 60%, var(--accent-glow-soft) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        .chart-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 20px 60px var(--shadow-color);
        }
        .chart-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .chart-header h3 {
            font-family: var(--font-display);
            font-size: 13px; letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .chart-value {
            font-family: var(--font-display);
            font-size: 20px; font-weight: 700;
            color: var(--text-primary);
        }
        .chart-canvas-wrap {
            position: relative; height: 220px;
        }
        .chart-canvas {
            width: 100%; height: 100%;
        }

        /* ===== BAR CHART (CSS) ===== */
        .bar-chart {
            display: flex; align-items: flex-end;
            gap: 8px; height: 200px;
            padding: 0 4px;
        }
        .bar-wrap {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; gap: 8px;
            height: 100%; justify-content: flex-end;
        }
        .bar {
            width: 100%; max-width: 32px;
            background: var(--bar-bg);
            border-radius: 6px 6px 3px 3px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }
        .bar:hover {
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .bar-tooltip {
            position: absolute; bottom: calc(100% + 8px); left: 50%;
            transform: translateX(-50%) scale(0);
            padding: 6px 10px;
            background: var(--bg-glass);
            border: 1px solid var(--bar-tooltip-border);
            border-radius: 8px;
            font-size: 11px; font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            font-family: var(--font-mono);
            color: var(--text-primary);
            backdrop-filter: blur(10px);
        }
        .bar:hover .bar-tooltip {
            transform: translateX(-50%) scale(1);
        }
        .bar-label {
            font-size: 10px; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* ===== LINE CHART CANVAS ===== */
        .line-chart-wrap {
            position: relative; height: 240px;
            margin-bottom: 32px;
        }
        .line-chart-wrap canvas {
            width: 100%; height: 100%;
        }

        /* ===== ACTIVITY LOG ===== */
        .activity-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 24px;
            transition: all 0.4s ease;
            position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease forwards;
        }
        .activity-card::before {
            content: ''; position: absolute; inset: 0; border-radius: 18px;
            padding: 1px;
            background: linear-gradient(160deg, var(--border-hover) 0%, transparent 40%, transparent 60%, var(--accent-glow-soft) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        .activity-card:hover {
            border-color: var(--border-hover);
        }
        .activity-card h3 {
            font-family: var(--font-display);
            font-size: 13px; letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .activity-list {
            display: flex; flex-direction: column; gap: 0;
        }
        .activity-item {
            display: flex; align-items: flex-start; gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .activity-item:hover {
            background: var(--bg-secondary);
            margin: 0 -12px; padding: 14px 12px;
            border-radius: 8px;
            border-bottom-color: transparent;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-icon {
            width: 36px; height: 36px; border-radius: 10px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; color: var(--accent);
            flex-shrink: 0;
            transition: all 0.3s;
            box-shadow: 0 0 15px var(--accent-glow-soft);
        }
        .activity-item:hover .activity-icon {
            background: var(--accent-glow-soft);
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .activity-text {
            flex: 1;
        }
        .activity-text strong {
            display: block; font-size: 13px; color: var(--text-primary);
            margin-bottom: 2px;
        }
        .activity-text span {
            font-size: 12px; color: var(--text-muted);
        }
        .activity-time {
            font-size: 11px; color: var(--text-dim);
            font-family: var(--font-mono);
            white-space: nowrap;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .nav-links { display: none; }
            .main-content { padding: 92px 20px 40px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .page-header { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 640px) {
            .navbar { padding: 0 16px; height: 60px; }
            .coin-badge span { display: none; }
            .stats-grid { grid-template-columns: 1fr; }
            .period-selector { width: 100%; justify-content: center; }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<base target="_blank">
</head>
<body>

    <!-- Background Effects -->
    <canvas id="network-canvas"></canvas>
    <div class="grid-overlay"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="noise"></div>
    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">
            <div class="logo-icon">A</div>
            <span class="brand-text">Amzy Host</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="deploy.html"><i class="fas fa-rocket"></i> Deploy</a>
            <a href="coins.html"><i class="fas fa-coins"></i> Store</a>
            <a href="analytics.html" class="active"><i class="fas fa-chart-line"></i> Analytics</a>
        </div>
        <div class="nav-right">
            <div class="coin-badge" onclick="window.location.href='coins.html'">
                <i class="fas fa-coins"></i>
                <span id="coin-balance">0</span>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">

            <div class="user-menu">

                <div class="dropdown">
                    <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>

    <!-- Main Content -->
    <main class="main-content">

            </div>
            <div class="period-selector">
                <button class="period-btn" onclick="changePeriod('24h', this)">24h</button>

                <button class="period-btn" onclick="changePeriod('90d', this)">90d</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-chart-bar"></i></div>
                <div class="stat-info">
                    <h3 id="total-requests">0</h3>
                    <p>Total Requests</p>
                    <div class="stat-change up"><i class="fas fa-arrow-up"></i> 12%</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-tachometer-alt"></i></div>
                <div class="stat-info">
                    <h3 id="avg-response">0ms</h3>
                    <p>Avg Response</p>
                    <div class="stat-change down"><i class="fas fa-arrow-down"></i> 8%</div>

            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-server"></i></div>
                <div class="stat-info">
                    <h3 id="uptime-stat">99.9%</h3>
                    <p>Uptime</p>
                    <div class="stat-change up"><i class="fas fa-arrow-up"></i> 0.1%</div>
                </div>

            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <div class="stat-info">
                    <h3 id="total-errors">0</h3>
                    <p>Errors</p>
                    <div class="stat-change down"><i class="fas fa-arrow-down"></i> 23%</div>
                </div>
            </div>
        </div>

        <!-- Line Chart -->
        <div class="chart-card" style="margin-bottom:20px;">
            <div class="chart-header">
                <h3><i class="fas fa-wave-square"></i> Request Traffic</h3>
                <span class="chart-value" id="traffic-value">0</span>
            </div>
            <div class="chart-canvas-wrap">
                <canvas id="lineChart"></canvas>
            </div>
        </div>

        <!-- Bar Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <h3><i class="fas fa-robot"></i> Bot Requests</h3>
                    <span class="chart-value" id="bot-req-value">0</span>
                </div>
                <div class="bar-chart" id="requests-chart"></div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <h3><i class="fas fa-coins"></i> Coin Usage</h3>
                    <span class="chart-value" id="coin-use-value">0</span>
                </div>
                <div class="bar-chart" id="coins-chart"></div>
            </div>
        </div>

        <!-- Activity Log -->
        <div class="activity-card">
            <h3><i class="fas fa-list-ul"></i> Recent Activity</h3>
            <div class="activity-list" id="activity-list"></div>
        </div>
    </main>

<script>
    // ===== THEME SYSTEM =====
    const themeIcon = document.getElementById('theme-icon');
    const html = document.documentElement;

    function initTheme() {
        const savedTheme = localStorage.getItem('amzy-theme');
        const savedMode = localStorage.getItem('amzy-theme-mode') || 'manual';

        if (savedMode === 'system') {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        } else if (savedTheme) {
            html.setAttribute('data-theme', savedTheme);
        } else {
            html.setAttribute('data-theme', 'dark');
        }
        updateThemeIcon();
    }

    function updateThemeIcon() {
        const isDark = html.getAttribute('data-theme') === 'dark';
        themeIcon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
    }

    function toggleTheme() {
        const current = html.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('amzy-theme', next);
        localStorage.setItem('amzy-theme-mode', 'manual');
        updateThemeIcon();
        // Redraw charts to pick up new theme colors
        drawLineChart('lineChart', currentData.traffic);
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (localStorage.getItem('amzy-theme-mode') === 'system') {
            html.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            updateThemeIcon();
            drawLineChart('lineChart', currentData.traffic);
        }
    });

    initTheme();

    // ===== PARTICLE NETWORK =====
    const canvas = document.getElementById('network-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null };

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.size = Math.random() * 1.5 + 0.5;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

            if (mouse.x != null) {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    const force = (120 - dist) / 120;
                    this.vx -= (dx / dist) * force * 0.3;
                    this.vy -= (dy / dist) * force * 0.3;
                }
            }
        }

        draw() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = isDark 
                ? `rgba(99, 102, 241, ${this.size * 0.2})`
                : `rgba(79, 70, 229, ${this.size * 0.15})`;
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.min(60, Math.floor((canvas.width * canvas.height) / 20000));
        for (let i = 0; i < count; i++) particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const isDark = html.getAttribute('data-theme') === 'dark';

        particles.forEach(p => { p.update(); p.draw(); });

        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = isDark
                        ? `rgba(99, 102, 241, ${0.06 * (1 - dist / 100)})`
                        : `rgba(79, 70, 229, ${0.04 * (1 - dist / 100)})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animateParticles);
    }

    resizeCanvas();
    initParticles();
    animateParticles();

    window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

    // ===== LINE CHART =====
    function drawLineChart(canvasId, data) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const w = rect.width, h = rect.height;
        const pad = { top: 20, right: 20, bottom: 30, left: 40 };
        const cw = w - pad.left - pad.right;
        const ch = h - pad.top - pad.bottom;

        const max = Math.max(...data.map(d => d.value)) * 1.1;
        const min = 0;

        ctx.clearRect(0, 0, w, h);

        // Grid lines
        ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--chart-grid').trim() || 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
            const y = pad.top + (ch / 4) * i;
            ctx.beginPath();
            ctx.moveTo(pad.left, y);
            ctx.lineTo(w - pad.right, y);
            ctx.stroke();

            const val = Math.round(max - (max / 4) * i);
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--chart-label').trim() || 'rgba(255,255,255,0.2)';
            ctx.font = '10px JetBrains Mono';
            ctx.textAlign = 'right';
            ctx.fillText(val, pad.left - 8, y + 3);
        }

        // X labels
        data.forEach((d, i) => {
            const x = pad.left + (cw / (data.length - 1)) * i;
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--chart-label').trim() || 'rgba(255,255,255,0.25)';
            ctx.font = '10px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(d.label, x, h - 10);
        });

        // Area fill
        ctx.beginPath();
        ctx.moveTo(pad.left, pad.top + ch);
        data.forEach((d, i) => {
            const x = pad.left + (cw / (data.length - 1)) * i;
            const y = pad.top + ch - ((d.value - min) / (max - min)) * ch;
            if (i === 0) ctx.lineTo(x, y);
            else {
                const prevX = pad.left + (cw / (data.length - 1)) * (i - 1);
                const prevY = pad.top + ch - ((data[i-1].value - min) / (max - min)) * ch;
                const cpX = (prevX + x) / 2;
                ctx.bezierCurveTo(cpX, prevY, cpX, y, x, y);
            }
        });
        ctx.lineTo(pad.left + cw, pad.top + ch);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
        grad.addColorStop(0, getComputedStyle(document.body).getPropertyValue('--chart-fill-start').trim() || 'rgba(255,255,255,0.08)');
        grad.addColorStop(1, getComputedStyle(document.body).getPropertyValue('--chart-fill-end').trim() || 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fill();

        // Line
        ctx.beginPath();
        data.forEach((d, i) => {
            const x = pad.left + (cw / (data.length - 1)) * i;
            const y = pad.top + ch - ((d.value - min) / (max - min)) * ch;
            if (i === 0) ctx.moveTo(x, y);
            else {
                const prevX = pad.left + (cw / (data.length - 1)) * (i - 1);
                const prevY = pad.top + ch - ((data[i-1].value - min) / (max - min)) * ch;
                const cpX = (prevX + x) / 2;
                ctx.bezierCurveTo(cpX, prevY, cpX, y, x, y);
            }
        });
        ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--chart-line').trim() || 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Points
        data.forEach((d, i) => {
            const x = pad.left + (cw / (data.length - 1)) * i;
            const y = pad.top + ch - ((d.value - min) / (max - min)) * ch;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--chart-point').trim() || '#000';
            ctx.fill();
            ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--chart-point-border').trim() || 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }

    // ===== BAR CHART =====
    function generateBarChart(containerId, data) {
        const container = document.getElementById(containerId);
        const max = Math.max(...data.map(d => d.value)) * 1.1;

        container.innerHTML = data.map(d => {
            const height = (d.value / max) * 100;
            return `
                <div class="bar-wrap">
                    <div class="bar" style="height: 0%;" data-height="${height}%">
                        <div class="bar-tooltip">${d.value.toLocaleString()}</div>
                    </div>
                    <span class="bar-label">${d.label}</span>
                </div>
            `;
        }).join('');

        // Animate bars
        setTimeout(() => {
            container.querySelectorAll('.bar').forEach(bar => {
                bar.style.height = bar.dataset.height;
            });
        }, 100);
    }

    // ===== DATA GENERATION =====
    function genData(period) {
        const counts = { '24h': 24, '7d': 7, '30d': 15, '90d': 12 };
        const count = counts[period] || 7;
        const labels = { '24h': Array.from({length:24},(_,i)=>`${i}:00`), '7d': ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], '30d': Array.from({length:15},(_,i)=>`${(i*2)+1}`), '90d': ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'] };
        const lbs = labels[period] || labels['7d'];

        return {
            requests: lbs.slice(0, count).map(l => ({ label: l, value: Math.floor(Math.random() * 800) + 200 })),
            coins: lbs.slice(0, count).map(l => ({ label: l, value: Math.floor(Math.random() * 40) + 5 })),
            traffic: lbs.slice(0, count).map(l => ({ label: l, value: Math.floor(Math.random() * 1200) + 300 }))
        };
    }

    function updateStats(data) {
        const totalReq = data.requests.reduce((s, d) => s + d.value, 0);
        const totalCoin = data.coins.reduce((s, d) => s + d.value, 0);
        animateNum('total-requests', totalReq);
        animateNum('total-errors', Math.floor(totalReq * 0.02));
        document.getElementById('avg-response').textContent = (Math.floor(Math.random() * 30) + 30) + 'ms';
        document.getElementById('traffic-value').textContent = totalReq.toLocaleString();
        document.getElementById('bot-req-value').textContent = totalReq.toLocaleString();
        document.getElementById('coin-use-value').textContent = totalCoin.toLocaleString();
    }

    function animateNum(id, target) {
        const el = document.getElementById(id);
        let current = 0;
        const inc = target / 20;
        const timer = setInterval(() => {
            current += inc;
            if (current >= target) { current = target; clearInterval(timer); }
            el.textContent = Math.floor(current).toLocaleString() + (id === 'avg-response' ? 'ms' : id === 'uptime-stat' ? '%' : '');
        }, 30);
    }

    // ===== ACTIVITY LOG =====
    const activities = [
        { icon: 'fa-rocket', text: 'Deployed WeatherBot', sub: 'Node.js runtime', time: '2 min ago' },
        { icon: 'fa-coins', text: 'Purchased 25 coins', sub: '₦1,000 via bank transfer', time: '15 min ago' },
        { icon: 'fa-robot', text: 'Bot GameBot restarted', sub: 'Auto-recovery triggered', time: '1 hr ago' },
        { icon: 'fa-key', text: 'API key regenerated', sub: 'Old key revoked', time: '3 hrs ago' },
        { icon: 'fa-user', text: 'Profile updated', sub: 'Email changed', time: '5 hrs ago' },
        { icon: 'fa-exclamation-triangle', text: 'High memory usage', sub: 'NewsBot exceeded limit', time: '8 hrs ago' },
    ];

    function renderActivity() {
        const list = document.getElementById('activity-list');
        list.innerHTML = activities.map(a => `
            <div class="activity-item">
                <div class="activity-icon"><i class="fas ${a.icon}"></i></div>
                <div class="activity-text">
                    <strong>${a.text}</strong>
                    <span>${a.sub}</span>
                </div>
                <span class="activity-time">${a.time}</span>
            </div>
        `).join('');
    }

    // ===== PERIOD SWITCH =====
    let currentData = genData('7d');

    function changePeriod(period, btn) {
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentData = genData(period);
        generateBarChart('requests-chart', currentData.requests);
        generateBarChart('coins-chart', currentData.coins);
        drawLineChart('lineChart', currentData.traffic);
        updateStats(currentData);
    }

    // ===== INIT =====
    generateBarChart('requests-chart', currentData.requests);
    generateBarChart('coins-chart', currentData.coins);
    drawLineChart('lineChart', currentData.traffic);
    updateStats(currentData);
    renderActivity();

    window.addEventListener('resize', () => {
        drawLineChart('lineChart', currentData.traffic);
    });

    // ===== COINS =====
    function updateCoins() {
        const c = parseInt(localStorage.getItem('amzy-coins') || '0');
        document.getElementById('coin-balance').textContent = c;
    }

    // ===== LOGOUT =====
    function logout() {
        localStorage.removeItem('amzy-token');
        localStorage.removeItem('amzy-user');
        window.location.href = 'login.html';
    }

    // ===== AUTH =====
    if (!localStorage.getItem('amzy-token')) window.location.href = 'login.html';
    updateCoins();

    // ===== NAVBAR SCROLL =====
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
        const nav = document.querySelector('.navbar');
        const y = window.scrollY;
        if (y > lastScroll && y > 80) nav.style.transform = 'translateY(-100%)';
        else nav.style.transform = 'translateY(0)';
        lastScroll = y;
    });
</script>
